# ConfigMaps for shared configuration
# Not sure if since I have app in my frontend, this is front and back or smth?
apiVersion: v1 
kind: ConfigMap
metadata:
  name: road-config
# 1. Config 
data: 
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: db_road
  DB_USER: road_app

---
# Database stable inside cluster
# Here AI suggested the HeadlessService to supply the StatefulSet network identity
apiVersion: v1
# I originally set it up as a PVC not the case
kind: Service
metadata: 
  name: db
spec: 
  clusterIP: None
  selector: 
    app: db
  ports: 
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306

---
# Services 
# Depoyment to manage backend and frontend pods, originally I had db separated from the StatefulSet but here AI corrected saying I also needed db in the stateful
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db
    # Will change image if it changes later on but for now this is the one also in docker-compose
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8

          ports:
            - name: mysql
              containerPort: 3306

          # Get db info from env w the configMapKeyRef 
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_NAME

            # To access and use db
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_USER

            # Getting password and setting as secret 
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_PASSWORD

            # Getting root and setting as secret 
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_ROOT_PASSWORD

          # This AI suggestion
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql

            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      # Set up the memory w the road-db configuration stuff done above, mounts w SQL script
      volumes:
        - name: db-init
          configMap:
            name: road-db-init

  # To set up persistent memory accross the pods 
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
# ====================================================================================
# CONFIGURATION 
# ====================================================================================
# ConfigMaps for shared configuration
# Not sure if since I have app in my frontend, this is front and back or smth?
apiVersion: v1 
kind: ConfigMap
metadata:
  name: road-config
# 1. Config 
data: 
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: db_road
  DB_USER: road_app

---
# ====================================================================================
# DATABASE 
# ====================================================================================

# Database stable inside cluster
# Here its the service for db ports service 
apiVersion: v1
# I originally set it up as a PVC not the case
kind: Service
metadata: 
  name: db
spec: 
  # The clusterIP as none configures it as a headless service so that Kubernetes does not load balance the traffic, instead returns individual DNS entries 
  clusterIP: None
  selector: 
    app: db
  ports: 
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306

---
# StatefulSet to manage database pods with service defined above, originally I had db separated from the StatefulSet but here AI corrected saying I also needed db in the stateful
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db
    # Will change image if it changes later on but for now this is the one also in docker-compose
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8

          ports:
            - name: mysql
              containerPort: 3306

          # Get db info from env w the configMapKeyRef 
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_NAME

            # To access and use db
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_USER

            # Getting password and setting as secret 
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_PASSWORD

            # Getting root and setting as secret 
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_ROOT_PASSWORD

          # This AI suggestion to mount data, I had used the joyvan from jupyter but here it is the docker entrypoint instead 
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql

            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          
          # Checking readiness with a probe 
          ## First run startup (makes sure app succeeds, useful if app starts slow), readiness (eval app can accept traffic before routing), liveness (checks if app is deadlocked/unhealthy and restarts container if fail threshold of failed tests)
          # Gives ample time to succeed 
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          # And then check if it can recieve traffic 
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # livenessProbe: 
          #   exec: 
          #     command: 
          #       - /healthcheck.sh
          #       - --readiness
          #     initialDelaySeconds: 60
          #     periodSeconds: 5

      # Set up the memory w the road-db configuration stuff done above, mounts w SQL script
      volumes:
        - name: db-init
          configMap:
            name: road-db-init

  # To set up persistent memory accross the pods 
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

---
# ====================================================================================
# FRONTEND 
# ====================================================================================
# Runs frontend and nginx container deployment
# So deplopyment creates pod called app: frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2

  # Added for rolling updates 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # All originals stay up until a new one is ready to take its place 
      maxSurge: 1 # One max extra pod created while prepping to replace old pod

  # Now to actually add label to the pod and configure it 
  selector:
    matchLabels:
      app: frontend
  
  # Gets the image itself of the frontend, careful as I modify tags in future updates
  template:
    metadata:
      labels:
        app: frontend
    # Here directly gets the img from the repo
    spec:
      containers:
        - name: frontend
          # Updated now to v2 to handle login
          image: australia-southeast2-docker.pkg.dev/project-5472a16f-e6cd-4347-b79/road-report/frontend:v5
          imagePullPolicy: Always # Added from AI suggestion to check if there are new images
          ports:
            - containerPort: 80
          
          # Probing readiness w initial delay to wait before checking it
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

          # Probe liveness on nginx port
          # Checks ready every five seconds w 2 second timeout, and max fails 3 times before getting purged and having a new one in its place
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

---
# Frontend public entrypoint with service 
apiVersion: v1
kind: Service 
metadata: 
  name: frontend
spec: 
  # Adds load balancer to frontend/nginx by GKE 
  type: LoadBalancer

  # Now servie is selecting the previously labelled pod 
  selector:  
    app: frontend
  
  # This very much AI suggestion, originally I was mapping to app port but specified I was unsure if I should use port 80 or 8080 from app
  # Requests arrive to service port 80 and go to pods port 80 to nginx 
  ports: 
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
# ====================================================================================
# BACKEND: ACCOUNTS 
# ====================================================================================
# Backend accounts 
# So deplopyment creates pod labelled app: accounts for that service 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 2

  # Added for rolling updates 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # All originals stay up until a new one is ready to take its place 
      maxSurge: 1 # One max extra pod created while prepping to replace old pod

  selector:
    matchLabels:
      app: accounts

  # Gets the image itself of the accounts, careful as I modify tags in future updates
  template:
    metadata:
      labels:
        app: accounts
    # Here directly gets the img from the repo
    spec:
      containers:
        - name: accounts
          # Should handle the authentication, login and session
          image: australia-southeast2-docker.pkg.dev/project-5472a16f-e6cd-4347-b79/road-report/accounts:v5
          imagePullPolicy: Always
          # Not sure if it should be the vite port 5001 configured, the nginx.conf at 8000, or 80 for http traffic... I'm setting at 8000 for now... yeah AI says it is 8000 because Gunicorn listens there 
          ports:
            - containerPort: 8000
          
          # I had omitted db specification, AI says to use it... I guess frontend doesn't need db, but backend here does 
          envFrom: 
            - configMapRef: 
                name: road-config

          # So now has to reference the road-config env values from the config map
          env: 
            - name: DB_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: road-db-secret
                  key: DB_PASSWORD
            # AI suggestion to also add secret key generated with the setup_session_secret.sh
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: road-session-secret
                  key: SECRET_KEY

          # Probing readiness w initial delay to let db start up first
          readinessProbe:
            httpGet:
              path: /api/accounts/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

          # Probe liveness on nginx port
          # Checks ready every five seconds w 2 second timeout, and max fails 3 times before getting purged and having a new one in its place
          livenessProbe:
            httpGet:
              path: /api/accounts/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

--- 
# Private internal entrypoint with service defined above 
# I had originally added a load balancer, but the AI let me know that each internal service maps the traffic to its pods, 
# so I can omit a public load balancer and let it handle its internal replicas based on traffic 
apiVersion: v1
kind: Service 
metadata: 
  name: accounts
spec: 
  # Making it a cluster IP instead of load balancer, article amlanscloud.com/reactappdeploy specifies that it serves to expose API endpoint within cluster so frontend can access and request data 
  type: ClusterIP

  # Now servie is selecting the previously labelled pod 
  selector:  
    app: accounts
  
  # Requests arrive to service port 8000 (AI correction, I had 80 previously) through pods and go to pods port 8000 to nginx config 
  ports: 
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
# ====================================================================================
# BACKEND: REPORTS 
# ====================================================================================
# Backend for reports, creating pod and labelling it reports
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
# Originally at 1, now at 2 check w $ kubectl get pods -l app=reports -o wide 
spec:
  replicas: 2

  # Added for rolling updates 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # All originals stay up until a new one is ready to take its place 
      maxSurge: 1 # One max extra pod created while prepping to replace old pod

  selector:
    matchLabels:
      app: reports

  # Gets the image itself of the reports, careful as I modify tags in future updates
  template:
    metadata:
      labels:
        app: reports
    # Here directly gets the img from the repo
    spec:
      containers:
        - name: reports
          image: australia-southeast2-docker.pkg.dev/project-5472a16f-e6cd-4347-b79/road-report/reports:v3
          imagePullPolicy: Always
          # Container port 8000 because Gunicorn listens there 
          ports:
            - containerPort: 8000
          
          # DB specification 
          envFrom: 
            - configMapRef: 
                name: road-config

          # Loads env vals from map 
          env: 
            - name: DB_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: road-db-secret
                  key: DB_PASSWORD
            # Use key to make sure only users with sessions can make reports
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: road-session-secret
                  key: SECRET_KEY

          # Probing readiness w initial delay to let db start up first
          readinessProbe:
            httpGet:
              path: /api/reports/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

          # Probe liveness on nginx port
          # Checks ready every five seconds w 2 second timeout, and max fails 3 times before getting purged and having a new one in its place
          livenessProbe:
            httpGet:
              path: /api/reports/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2 
            failureThreshold: 3

--- 
# Internal private entrypoint with service defined above for reports
apiVersion: v1
kind: Service 
metadata: 
  name: reports
spec: 
  # Making it a cluster IP instead of load balancer, article amlanscloud.com/reactappdeploy specifies that it serves to expose API endpoint within cluster so frontend can access and request data internally 
  type: ClusterIP

  # Now servie is selecting the previously labelled pod 
  selector:  
    app: reports
  
  # Go to reports pod guicorn server on port 8000 to then communicate w MariaDB
  ports: 
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
# ConfigMaps for shared configuration
# Not sure if since I have app in my frontend, this is front and back or smth?
apiVersion: v1 
kind: ConfigMap
metadata:
  name: road-config
# 1. Config 
data: 
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: db_road
  DB_USER: road_app

---
# Database stable inside cluster
# Here its the service for db ports service 
apiVersion: v1
# I originally set it up as a PVC not the case
kind: Service
metadata: 
  name: db
spec: 
  # The clusterIP as none configures it as a headless service so that Kubernetes does not load balance the traffic, instead returns individual DNS entries 
  clusterIP: None
  selector: 
    app: db
  ports: 
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306

---
# StatefulSet to manage database pods with service defined above, originally I had db separated from the StatefulSet but here AI corrected saying I also needed db in the stateful
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db
    # Will change image if it changes later on but for now this is the one also in docker-compose
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8

          ports:
            - name: mysql
              containerPort: 3306

          # Get db info from env w the configMapKeyRef 
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_NAME

            # To access and use db
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: road-config
                  key: DB_USER

            # Getting password and setting as secret 
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_PASSWORD

            # Getting root and setting as secret 
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: road-db-secret
                  key: DB_ROOT_PASSWORD

          # This AI suggestion
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql

            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      # Set up the memory w the road-db configuration stuff done above, mounts w SQL script
      volumes:
        - name: db-init
          configMap:
            name: road-db-init

  # To set up persistent memory accross the pods 
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

---
# Runs frontend and nginx container deployment
# So deplopyment creates pod called app: frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  # Gets the image itself of the frontend, careful as I modify tags in future updates
  template:
    metadata:
      labels:
        app: frontend
    # Here directly gets the img from the repo
    spec:
      containers:
        - name: frontend
          image: australia-southeast2-docker.pkg.dev/project-5472a16f-e6cd-4347-b79/road-report/frontend:v1
          ports:
            - containerPort: 80

---
# Frontend public entrypoint with service 
apiVersion: v1
kind: Service 
metadata: 
  name: frontend
spec: 
  # Adds load balancer to frontend/nginx by GKE 
  type: LoadBalancer

  # Now servie is selecting the previously labelled pod 
  selector:  
    app: frontend
  
  # This very much AI suggestion, originally I was mapping to app port but specified I was unsure if I should use port 80 or 8080 from app
  # Requests arrive to service port 80 and go to pods port 80 to nginx 
  ports: 
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
# Backend accounts 
# So deplopyment creates pod labelled app: accounts for that service 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 1

  selector:
    matchLabels:
      app: accounts

  # Gets the image itself of the frontend, careful as I modify tags in future updates
  template:
    metadata:
      labels:
        app: accounts
    # Here directly gets the img from the repo
    spec:
      containers:
        - name: accounts
          image: australia-southeast2-docker.pkg.dev/project-5472a16f-e6cd-4347-b79/road-report/accounts:v1
          # Not sure if it should be the vite port 5001 configured, the nginx.conf at 8000, or 80 for http traffic... I'm setting at 8000 for now... yeah AI says it is 8000 because Gunicorn listens there 
          ports:
            - containerPort: 8000
          
          # I had omitted db specification, AI says to use it... I guess frontend doesn't need db, but backend here does 
          envFrom: 
            - configMapRef: 
                name: road-config

          # So now has to reference the road-config env values from the config map
          env: 
            - name: DB_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: road-db-secret
                  key: DB_PASSWORD

--- 
# Backend public entrypoint with service defined above 
# I had originally added a load balancer, but the AI let me know that each internal service maps the traffic to its pods, 
# so I can omit a public load balancer and let it handle its internal replicas based on traffic 
apiVersion: v1
kind: Service 
metadata: 
  name: accounts
spec: 
  # Making it a cluster IP instead of load balancer, article amlanscloud.com/reactappdeploy specifies that it serves to expose API endpoint within cluster so frontend can access and request data 
  type: ClusterIP

  # Now servie is selecting the previously labelled pod 
  selector:  
    app: accounts
  
  # Requests arrive to service port 8000 (AI correction, I had 80 previously) through pods and go to pods port 8000 to nginx config 
  ports: 
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
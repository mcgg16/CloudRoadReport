services:
  # MariaDB based on assignment previously done 
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    # Local to database port to 3306 on my computer
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    # Make data persist
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks: 
      - backend
  
  # Accounts service
  accounts:
    image: cloudroad-accounts:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        API_SERVICE: api-accounts
    environment:
      # Database 
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Password hash with Flask built-in session
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "127.0.0.1:5001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Reports service 
  reports:
    image: cloudroad-reports:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        API_SERVICE: api-reports
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Adding secret key to handle user sessions so that only logged in users can make reports
      SECRET_KEY: ${SECRET_KEY} 
    ports:
      - "127.0.0.1:5002:8000"
    # I origianlly had volumes here, AI tool told me to remove them because the reports container runs w python 
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  # frontend nginx
  frontend: 
    image: cloudroad-frontend:local
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    # AI fix I originally had 5173 isntead of the APP_PORT
    ports: 
      - "${APP_PORT}:80" 
    # AI correction I only included reports before oops
    depends_on: 
      - accounts
      - reports
    networks: 
      - backend

# Data persistance 
volumes:
  mariadb_data:
    driver: local
  
# Define backend network because all of the containers communicate through backend, so no more frontend needed 
networks: 
  backend:
    driver: bridge
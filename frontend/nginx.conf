# File generated by chatgpt, but I revised the suggestions made; I had thought I could use vite.config.ts for the image 
# but the tool let me know I had to create a separate nginx.conf file 
server {
    # Using localhost for HTTP 80 port
    listen 80; 
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Fowards the accounts requests
    location /api/accounts/ {
        proxy_pass http://accounts:8000;
    }

    # Fowards the reports requests
    location /api/reports/ {
        proxy_pass http://reports:8000;
    }

    # Serves react website 
    location / {
        try_files $uri $uri/ /index.html;
    }
}